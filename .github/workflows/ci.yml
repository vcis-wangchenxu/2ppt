name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/ppt-master/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skills/ppt-master/requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q install.py skills/ppt-master/scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run environment doctor
        run: python skills/ppt-master/scripts/doctor.py --json

      - name: Verify attribution
        run: python skills/ppt-master/scripts/verify_attribution.py

      - name: Run deterministic smoke test
        run: python skills/ppt-master/scripts/smoke_test.py
