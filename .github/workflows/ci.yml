name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/ppt-master/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r skills/ppt-master/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q install.py tools skills/ppt-master/scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python skills/ppt-master/scripts/doctor.py --json
      - run: python skills/ppt-master/scripts/verify_attribution.py
      - run: python skills/ppt-master/scripts/smoke_test.py
      - run: sh skills/ppt-master/scripts/run-python.sh skills/ppt-master/scripts/attribution_guard.py
      - run: sh skills/ppt-master/scripts/run-python.sh skills/ppt-master/scripts/pptx_to_svg.py --help
      - run: sh skills/ppt-master/scripts/run-python.sh skills/ppt-master/scripts/svg_to_pptx.py --help
